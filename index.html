<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sim's Birthday Card 💖</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #ffe6f0, #d4bfff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.2rem;
      color: #ff69b4;
      margin-bottom: 1rem;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 380px;
    }

    .edit-name {
      font-size: 1rem;
      color: #555;
      margin-bottom: 15px;
    }

    input {
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      outline: none;
      width: 80%;
      text-align: center;
    }

    button {
      background-color: #ff69b4;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
    }

    button:hover {
      background-color: #ff85c1;
    }

    select {
      margin-top: 15px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #d4bfff;
      background-color: white;
      font-size: 1rem;
      color: #444;
      outline: none;
    }

    footer {
      margin-top: 25px;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      .card {
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday, <span id="name-display">Sim</span>! 🎉</h1>
    <div class="edit-name">
      <label for="name-input">Edit name:</label><br />
      <input type="text" id="name-input" placeholder="Enter a name" />
    </div>

    <div class="music-select">
      <label for="music">Choose your song:</label><br />
      <select id="music">
        <option value="diva">Diva</option>
        <option value="mermaid">Mermaid Melody - Legend of Mermaid</option>
        <option value="salut">Salut d'Amour Op.12</option>
      </select>
    </div>

    <button id="celebrate-btn">🎂 Celebrate!</button>
    <audio id="bg-music" preload="auto"></audio>

    <footer>Made with 💕 by Ryuu-G</footer>
  </div>

  <script>
    const nameDisplay = document.getElementById("name-display");
    const nameInput = document.getElementById("name-input");
    const musicSelect = document.getElementById("music");
    const celebrateBtn = document.getElementById("celebrate-btn");
    const bgMusic = document.getElementById("bg-music");

    // Convert Google Drive links to direct .mp3
    const songs = {
      diva: "https://docs.google.com/uc?export=download&id=1GDp884kxf93TbjMDTblw3Q0uPx7Ik7FM",
      mermaid: "https://docs.google.com/uc?export=download&id=1e2zLO6Wc8ytHeaG5yGtkHR4aMeByvX68",
      salut: "https://docs.google.com/uc?export=download&id=191drPWZ4lcy35dEQNYlGuaBI1vxoO8h1",
    };

    nameInput.addEventListener("input", () => {
      nameDisplay.textContent = nameInput.value || "Sim";
    });

    celebrateBtn.addEventListener("click", () => {
      const selectedSong = musicSelect.value;
      bgMusic.src = songs[selectedSong];
      bgMusic.play().catch((err) => {
        console.log("Autoplay blocked, user interaction required:", err);
      });
      alert(`🎉 Happy Birthday, ${nameDisplay.textContent}! Enjoy your song 💕`);
    });
  </script>
</body>
</html>
