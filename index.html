<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Happy Birthday! 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ffd6ea;
      --bg2:#d6f0ff;
      --accent-pink:#ff79c6;
      --accent-blue:#6fd3ff;
      --neon-shadow: 0 0 8px rgba(255,121,198,0.6), 0 0 18px rgba(111,211,255,0.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:'Nunito',sans-serif;
      background: radial-gradient(1200px 700px at 10% 20%, var(--bg2) 0%, transparent 20%),
                  radial-gradient(900px 500px at 90% 80%, var(--bg1) 0%, transparent 18%),
                  linear-gradient(135deg,#ffe7f5 0%,#e7f7ff 100%);
      display:flex;align-items:center;justify-content:center;padding:24px;
      overflow:hidden;
    }
    .card{
      width:min(980px,96%);
      background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.72));
      border-radius:20px;
      box-shadow:0 10px 30px rgba(19,24,40,0.08);
      padding:28px;
      display:grid;
      grid-template-columns:1fr 400px;
      gap:20px;
      align-items:center;
      position:relative;
      z-index:10;
    }
    @media(max-width:760px){
      .card{grid-template-columns:1fr;padding:18px}
      .aside{order:2}
    }
    .title{
      font-family:'Press Start 2P',monospace;
      font-size:20px;letter-spacing:2px;text-transform:uppercase;
      color:var(--accent-pink);text-shadow:var(--neon-shadow);
      margin:0 0 12px 0;
    }
    .subtitle{font-weight:700;margin:0 0 18px 0;font-size:28px}
    .subtitle .name{color:var(--accent-blue);text-shadow:0 6px 18px rgba(111,211,255,0.14)}
    .message{
      font-size:16px;line-height:1.6;color:#333;
      background:linear-gradient(180deg,rgba(255,255,255,0.6),transparent);
      padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.6);
      backdrop-filter:blur(6px);
    }
    .actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;flex-direction:column;}
    .btn{
      border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;
      border:0;outline:0;box-shadow:0 6px 0 rgba(0,0,0,0.12);
      transition:transform .06s ease,box-shadow .06s ease;
    }
    .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,0.08)}
    .btn-arcade{
      background:linear-gradient(180deg,var(--accent-pink),#ff5ea6);
      color:white;text-shadow:0 1px 0 rgba(0,0,0,0.2);
    }
    .btn-ghost{
      background:transparent;border:2px dashed rgba(43,43,43,0.06);
      color:#2b2b2b;font-weight:700;
    }
    .aside{
      padding:18px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0.4));
      display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;
      border:1px solid rgba(255,255,255,0.45);
    }
    .camera-frame{
      width:260px;
      height:200px;
      border:3px dashed rgba(0,0,0,0.1);
      border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#ffe8f6,#dff7ff);
      box-shadow:inset 0 0 12px rgba(255,121,198,0.2);
    }
    video,canvas{width:100%;height:100%;object-fit:cover;}
    .btn-photo{
      background:linear-gradient(180deg,var(--accent-blue),#52bfff);
      color:white;text-shadow:0 1px 0 rgba(0,0,0,0.2);
    }
    #confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1000;
    }
    footer{
      margin-top:30px;
      text-align:center;
      font-size:14px;
      opacity:0.7;
      font-weight:700;
    }
    select#musicSelector{
      padding:10px;
      border-radius:10px;
      border:2px solid rgba(0,0,0,0.1);
      background:white;
      font-weight:700;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="card">
    <div>
      <h1 class="title">★Happy Birthday★</h1>
      <h2 class="subtitle">Wishing you the best, <span class="name">Sim</span>!</h2>

      <div class="message">
        YO — sending you a pocketful of pink glitter on your special day. May your day be filled with happy-happy macarons, happiness made go! 
      </div>

      <div class="actions">
        <button class="btn btn-arcade" id="playBtn">🍓Celebrate</button>
        <button class="btn btn-ghost" id="changeName">✎ Edit Name</button>
        <button class="btn btn-ghost" id="downloadPNG">📷 Save Snapshot</button>

        <!-- 🎵 Music Selector -->
        <select id="musicSelector">
          <option value="">🎶 Choose a song...</option>
          <option value="https://docs.google.com/uc?export=download&id=1GDp884kxf93TbjMDTblw3Q0uPx7Ik7FM">Diva</option>
          <option value="https://docs.google.com/uc?export=download&id=1e2zLO6Wc8ytHeaG5yGtkHR4aMeByvX68">Mermaid Melody - Legend of Mermaid</option>
          <option value="https://docs.google.com/uc?export=download&id=191drPWZ4lcy35dEQNYlGuaBI1vxoO8h1">Salut d'Amour Op.12</option>
        </select>
      </div>

      <footer>Made by PING 🦝✨</footer>
    </div>

    <aside class="aside">
      <div class="camera-frame" id="cameraFrame">
        <video id="video" autoplay playsinline></video>
        <canvas id="photoCanvas" style="display:none;"></canvas>
      </div>
      <button class="btn btn-photo" id="takePhoto">📸 Take Photo</button>

      <div class="gift">
        <div class="box">🎁</div>
        <div style="text-align:left">
          <div style="font-weight:800">A tiny surprise</div>
          <div style="font-size:15px;opacity:0.8">Tap celebrate to unleash confetti & sound</div>
        </div>
      </div>
    </aside>
  </div>

  <audio id="bgMusic" preload="auto"></audio>

  <script>
    const $ = s => document.querySelector(s);
    const nameEl = $('.name');
    const changeName = $('#changeName');
    const playBtn = $('#playBtn');
    const takePhoto = $('#takePhoto');
    const video = $('#video');
    const photoCanvas = $('#photoCanvas');
    const downloadPNG = $('#downloadPNG');
    const music = $('#bgMusic');
    const musicSelector = $('#musicSelector');
    const ctxA = new (window.AudioContext||window.webkitAudioContext)();

    const stored = localStorage.getItem('bday_name') || 'Sim';
    nameEl.textContent = stored;

    changeName.addEventListener('click', ()=>{
      const val = prompt('Enter the birthday name:', nameEl.textContent);
      if(val!==null){
        const cleaned = val.trim() || 'Sim';
        nameEl.textContent = cleaned;
        localStorage.setItem('bday_name', cleaned);
      }
    });

    async function startCamera(){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        video.srcObject = stream;
      }catch(err){ console.log('Camera unavailable.'); }
    }
    startCamera();

    takePhoto.addEventListener('click', ()=>{
      const ctx = photoCanvas.getContext('2d');
      photoCanvas.width = video.videoWidth;
      photoCanvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      video.style.display='none';
      photoCanvas.style.display='block';
      playBeep();
    });

    downloadPNG.addEventListener('click', ()=>{
      if(photoCanvas.style.display === 'none'){
        alert('Take a photo first!');
        return;
      }
      const link = document.createElement('a');
      link.download = 'snapshot.png';
      link.href = photoCanvas.toDataURL('image/png');
      link.click();
    });

    function playBeep(){
      const now = ctxA.currentTime;
      const osc = ctxA.createOscillator();
      const gain = ctxA.createGain();
      osc.type='square'; osc.frequency.value=600;
      gain.gain.setValueAtTime(0.1, now);
      osc.connect(gain); gain.connect(ctxA.destination);
      osc.start(now); osc.stop(now+0.2);
    }

    const canvas = $('#confetti');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
    window.addEventListener('resize', ()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});
    function rand(a,b){return Math.random()*(b-a)+a}
    function makeConfetti(){
      const c=[];const colors=['#ff79c6','#6fd3ff','#ffd6ea','#bfeaff','#fff38a'];
      for(let i=0;i<120;i++){c.push({x:rand(0,W),y:rand(-H,0),vx:rand(-2,2),vy:rand(1,6),r:rand(6,12),c:colors[Math.floor(rand(0,colors.length))]});}
      return c;
    }
    let confetti=[];let anim=null;
    function confettiLoop(){
      ctx.clearRect(0,0,W,H);
      for(let p of confetti){p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r*0.6);}
      confetti=confetti.filter(p=>p.y<H+60);
      if(confetti.length===0){cancelAnimationFrame(anim);anim=null;}
      else anim=requestAnimationFrame(confettiLoop);
    }

    function startParty(){
      const chosen = musicSelector.value;
      if(!chosen){
        alert('🎵 Please choose a song first!');
        return;
      }
      music.src = chosen;
      if(anim)return;
      confetti=makeConfetti();
      confettiLoop();
      music.currentTime = 0;
      music.play().catch(()=>alert("Tap again to enable sound 🎵"));
      playBeep();
    }

    playBtn.addEventListener('click', startParty);
  </script>
</body>
</html>
